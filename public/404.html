<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Landlord</title>
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
  :root { color-scheme: light dark; --fg: #171717; --muted: #525252; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ededed; --muted: #a3a3a3; --bg: #0a0a0a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 32px; text-align: center; }
  img { width: 64px; height: 64px; }
  p.eyebrow { margin: 20px 0 4px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: -0.02em; }
  p { color: var(--muted); }
  a.btn { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 10px; background: #166534; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <p class="eyebrow">Error 404</p>
  <h1>No such square on this board.</h1>
  <p>The page you were looking for does not exist. The simulator lives on the start page.</p>
  <a class="btn" href="/">Open Landlord</a>
</main>
</body>
</html>
