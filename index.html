    <script>
      // before first paint: theme (light unless dark was chosen) and language (saved, else the browser's)
      try {
        document.documentElement.dataset.theme = localStorage.getItem('landlord:theme') === 'dark' ? 'dark' : 'light';
        const lang = localStorage.getItem('landlord:lang') || (navigator.language || 'en').slice(0, 2);
        document.documentElement.lang = lang === 'de' ? 'de' : 'en';
